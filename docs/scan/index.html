<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#000000">
	<title>SPQR Scanner</title>
	<meta name="description" content="Scan SPQR colour QR codes, and ordinary QR codes, with your phone camera. Runs entirely in your browser.">
	<link rel="icon" href="../favicon.svg" type="image/svg+xml">
	<style>
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; background: #000; color: #fff; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
		body { overflow: hidden; }
		#video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
		/* The overlay must be cropped exactly like the video, so it gets the same object-fit. */
		#overlay { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
		.frame { position: fixed; top: 50%; left: 50%; width: min(70vw, 70vh); aspect-ratio: 1; transform: translate(-50%, -50%); border: 3px solid rgba(255, 255, 255, 0.8); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.35); pointer-events: none; }
		header { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 14px) 16px 14px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(rgba(0, 0, 0, 0.6), transparent); }
		header strong { letter-spacing: 0.05em; }
		header a { color: #fff; opacity: 0.85; font-size: 0.9rem; }
		.bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 18px); display: flex; flex-direction: column; align-items: center; gap: 12px; background: linear-gradient(transparent, rgba(0, 0, 0, 0.7)); }
		.status { min-height: 1.4em; text-align: center; text-shadow: 0 1px 3px #000; }
		.chips { display: flex; gap: 8px; min-height: 30px; }
		.chip { padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.45); font-size: 0.85rem; background: rgba(0, 0, 0, 0.45); color: rgba(255, 255, 255, 0.75); }
		.chip.ok { color: #fff; font-weight: 600; }
		.chip.ok.R { border-color: #ff4040; }
		.chip.ok.G { border-color: #22dd44; }
		.chip.ok.B { border-color: #5577ff; }
		.chip.tentative { opacity: 0.5; border-style: dashed; }
		.buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
		button, .button { padding: 12px 20px; font: 600 16px/1 system-ui, sans-serif; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.5); color: #fff; cursor: pointer; text-decoration: none; text-align: center; }
		button.primary, .button.primary { background: #e5484d; border-color: #e5484d; }
		.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 80vh; overflow-y: auto; padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); background: #1c1c1a; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5); }
		.sheet .kind { margin: 0 0 10px; color: #4ade80; font-weight: 600; }
		.sheet pre { margin: 0 0 16px; padding: 12px; white-space: pre-wrap; word-break: break-word; background: #2a2a27; border-radius: 8px; font-size: 15px; max-height: 40vh; overflow-y: auto; }
		.sheet .buttons { justify-content: stretch; }
		.sheet .buttons > * { flex: 1 1 140px; }
		.notice { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
		.notice p { max-width: 34ch; margin: 0; }
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<video id="video" playsinline muted></video>
	<canvas id="overlay"></canvas>
	<div class="frame" id="frame" aria-hidden="true"></div>

	<header>
		<strong>SPQR scanner</strong>
		<a href="../">Make a code</a>
	</header>

	<div class="notice" id="notice" hidden>
		<p id="noticeText"></p>
		<div class="buttons">
			<button type="button" class="primary" id="retryBtn">Start camera</button>
			<button type="button" id="uploadBtn2">Choose a photo</button>
		</div>
	</div>

	<div class="bottom" id="bottom">
		<div class="chips" id="chips" aria-live="polite"></div>
		<div class="status" id="status">Point your camera at an SPQR or QR code</div>
		<div class="buttons">
			<button type="button" id="uploadBtn">Choose a photo</button>
		</div>
	</div>

	<div class="sheet" id="sheet" role="dialog" aria-labelledby="kind" hidden>
		<p class="kind" id="kind"></p>
		<pre id="text"></pre>
		<div class="buttons" id="actions"></div>
	</div>

	<input type="file" id="fileInput" accept="image/*" hidden>

	<script src="../vendor/qrcodegen.min.js"></script>
	<script src="../vendor/jsQR.js"></script>
	<script type="module" src="scan.js"></script>
</body>
</html>
